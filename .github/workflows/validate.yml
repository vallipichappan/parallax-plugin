name: Validate plugin

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run partial public perimeter scan over introduced commits
        env:
          PARALLAX_ALLOW_PARTIAL_SCAN: "1"
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Partial perimeter scan: private canary terms were not supplied by CI." >> "$GITHUB_STEP_SUMMARY"
          # A branch-creation push has no prior commit; scan the pushed tree instead.
          if [ -z "${SCAN_BASE//0/}" ]; then
            echo "No base commit (branch creation): scanning the tip tree only." >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/perimeter-scan.py --source head
          else
            python3 scripts/perimeter-scan.py --range "$SCAN_BASE..$SCAN_TIP"
          fi

      - name: Validate Claude plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.281 plugin validate --strict parallax
          npx --yes @anthropic-ai/claude-code@2.1.281 plugin validate --strict .claude-plugin/marketplace.json
